<!DOCTYPE html>
<html>
<head>
    <title>观众端 (Viewer)</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f2f5; color: #333; }
        h1, h2 { color: #1a73e8; }
        video { border: 2px solid #ccc; border-radius: 8px; width: 100%; max-width: 640px; background: #000; display: block; margin-bottom: 15px;}
        #logs { white-space: pre-wrap; font-family: monospace; background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 5px; max-height: 200px; overflow-y: auto; margin-top: 20px; }
        #userInfo { background-color: #e3f2fd; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
        .room-list { list-style: none; padding: 0; }
        .room-list li { background: #fff; border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .room-list button { background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        
        /* Consistent Button Styles */
        #in-call-view .controls button, #in-call-view > button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        #in-call-view #leaveRoomButton {
             background-color: #dc3545; /* Keep leave button red for distinction */
        }
        #in-call-view .controls input {
            border: 1px solid #ccc;
            padding: 9px;
            border-radius: 5px;
            margin-right: 5px;
        }
        #in-call-view .controls button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #in-call-view .controls input:disabled {
            background-color: #eee;
            cursor: not-allowed;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/uuid/8.3.2/uuid.min.js"></script>
</head>
<body>
    <h1>观众端 (Viewer)</h1>
    <div id="userInfo"></div>

    <!-- Room Selection View -->
    <div id="room-selection-view">
        <h2>可用直播间</h2>
        <ul id="roomList" class="room-list"></ul>
    </div>

    <!-- In-Call View -->
    <div id="in-call-view" style="display:none;">
        <video id="remoteVideo" autoplay playsinline></video>
        <button id="leaveRoomButton">离开房间</button>
        <hr>
        <div class="controls">
            <input type="text" id="chatInput" placeholder="输入弹幕...">
            <button id="sendChatButton">发送</button>
        </div>
        <h3>事件日志:</h3>
        <div id="logs"></div>
    </div>

    <script>
        // --- DOM Elements ---
        const userInfoDisplay = document.getElementById('userInfo');
        const roomSelectionView = document.getElementById('room-selection-view');
        const inCallView = document.getElementById('in-call-view');
        const roomList = document.getElementById('roomList');
        const remoteVideo = document.getElementById('remoteVideo');
        const logs = document.getElementById('logs');
        const leaveRoomButton = document.getElementById('leaveRoomButton');
        const chatInput = document.getElementById('chatInput');
        const sendChatButton = document.getElementById('sendChatButton');

        // --- App State ---
        let peerConnection;
        let dataChannel;
        let userInfo = {};
        let broadcasterId = null;
        let currentRoomId = null;
        let isMuted = false; // New state for mute status
        let iceServersConfig = [{ urls: 'stun:stun.l.google.com:19302' }]; // Default or received from server

        // --- UI State Management ---
        function showRoomSelection() {
            inCallView.style.display = 'none';
            roomSelectionView.style.display = 'block';
            console.log('🔄 回到房间列表。');
            ws.send(JSON.stringify({ type: 'list-rooms' }));
            isMuted = false; // Reset mute status when leaving room
            updateChatControlsState();
        }
        function showInCallView() {
            roomSelectionView.style.display = 'none';
            inCallView.style.display = 'block';
        }

        function updateChatControlsState() {
            chatInput.disabled = isMuted;
            sendChatButton.disabled = isMuted;
            if (isMuted) {
                chatInput.placeholder = '您已被禁言';
            } else {
                chatInput.placeholder = '输入弹幕...';
            }
        }

        // --- Logging ---
        function log(message) {
            console.log(message);
            if(inCallView.style.display === 'block') {
                logs.innerHTML += `[${new Date().toLocaleTimeString()}] ${message}\n`;
                logs.scrollTop = logs.scrollHeight;
            }
        }

        // --- User & Room List ---
        function initializeUser() {
            const storedUserInfo = localStorage.getItem('viewerUserInfo');
            if (storedUserInfo) userInfo = JSON.parse(storedUserInfo);
            else {
                const username = prompt("请输入您的昵称:", "观众" + Math.floor(Math.random() * 1000));
                userInfo = { persistentId: uuid.v4(), username: username || "匿名观众" };
                localStorage.setItem('viewerUserInfo', JSON.stringify(userInfo));
            }
            userInfoDisplay.innerHTML = `<strong>用户:</strong> ${userInfo.username} <small>(${userInfo.persistentId.substring(0, 4)})</small>`;
            updateChatControlsState(); // Set initial state
        }

        function renderRoomList(rooms) {
            roomList.innerHTML = '';
            if (rooms.length === 0) {
                roomList.innerHTML = '<li>当前没有直播间。</li>';
                return;
            }
            rooms.forEach(room => {
                const li = document.createElement('li');
                const passwordIcon = room.isPasswordProtected ? '<span style="margin-left: 5px;">&#128274;</span>' : ''; // Lock icon
                li.innerHTML = `<div><strong>${room.roomName}${passwordIcon}</strong> <br><small>主播: ${room.broadcasterName} | 观众: ${room.viewerCount}</small></div>
                              <button onclick="handleJoinRoomClick('${room.roomId}', ${room.isPasswordProtected})" style="background-color: #28a745;">加入</button>`;
                            roomList.appendChild(li);
                        });
                    }
                
                    // 处理加入房间按钮点击事件，根据需要提示密码
                    function handleJoinRoomClick(roomId, isPasswordProtected) {
                        let password = null;
                        if (isPasswordProtected) {
                            password = prompt("请输入房间密码:");
                            if (password === null) { // 用户取消了提示
                                log("🚫 用户取消加入房间。");
                                return;
                            }
                        }
                        joinRoom(roomId, password); // 调用 joinRoom 并传递密码（或 null）
                    }
                
                    // --- Signaling & Actions ---
                    const ws = new WebSocket('wss://live-test-stai.onrender.com');
                
                    ws.onopen = () => {
                        console.log('📡 连接到信令服务器。');
                        ws.send(JSON.stringify({
                            type: 'register',
                            payload: { persistentId: userInfo.persistentId, username: userInfo.username }
                        }));
                    };
                
                    ws.onmessage = async event => {
                        const message = JSON.parse(event.data);
                        console.log(`📩 [server] → ${message.type}`);
                
                        switch (message.type) {
                            case 'registered':
                                if (message.payload.iceServers) {
                                    iceServersConfig = message.payload.iceServers;
                                    console.log(`🧊 收到ICE服务器配置。`);
                                }
                                ws.send(JSON.stringify({ type: 'list-rooms' }));
                                break;
                                            case 'room-list':
                                                renderRoomList(message.payload.rooms); // Access the 'rooms' array within the payload
                                                break;                            case 'joined-room':
                                currentRoomId = message.payload.roomId;
                                log(`✅ 成功加入房间 ${currentRoomId.substring(0,4)}`);
                                showInCallView();
                                break;
                            case 'offer':
                                handleOffer(message.payload);
                                break;
                            case 'candidate':
                                handleCandidate(message.payload);
                                break;
                            case 'room-closed':
                                alert(`房间已关闭。`);
                                cleanupConnection();
                                showRoomSelection();
                                break;
                            case 'kicked':
                                alert(`你已被主播移出房间。`);
                                cleanupConnection();
                                showRoomSelection();
                                break;
                                            case 'viewer-muted-status':
                                                handleViewerMutedStatus(message.payload);
                                                break;
                                            case 'error': // Handle error messages from the server
                                                if (message.payload && message.payload.code === 'PASSWORD_INCORRECT') {
                                                    alert("密码不正确，请重新输入。");
                                                } else if (message.payload && message.payload.message) {
                                                    alert(`错误: ${message.payload.message}`);
                                                } else {
                                                    alert("发生未知错误。");
                                                }
                                                // For room joining errors, ensure we stay on the room selection view
                                                if (currentRoomId && (message.payload.code === 'PASSWORD_INCORRECT' || message.payload.code === 'ROOM_NOT_FOUND')) {
                                                    // If an error occurred after trying to join, clear selected room and show selection view
                                                    currentRoomId = null;
                                                    peerConnection = null; // Also clear peerConnection
                                                    showRoomSelection();
                                                }
                                                break;
                                        }                    };
                    
                    function joinRoom(roomId, password) { // Modified to accept password
                        ws.send(JSON.stringify({ type: 'join-room', payload: { roomId, password } })); // Modified to send password
                    }
        function leaveRoom() {
            if (currentRoomId) {
                ws.send(JSON.stringify({ type: 'leave-room' }));
                cleanupConnection();
                showRoomSelection();
            }
        }
        leaveRoomButton.onclick = leaveRoom;

        function sendChatMessage() {
            if (isMuted) {
                log('🚫 您已被禁言，无法发送弹幕。');
                return;
            }
            const text = chatInput.value;
            if (!text) return;
            if (dataChannel && dataChannel.readyState === 'open') {
                const message = { 
                    type: 'live.chat.message', 
                    payload: { user: userInfo.username, text: text } 
                };
                dataChannel.send(JSON.stringify(message));
                log(`💬 (我) ${text}`);
                chatInput.value = '';
            } else {
                log('⚠️ 无法发送弹幕，数据通道未连接。');
            }
        }
        sendChatButton.onclick = sendChatMessage;


        // --- WebRTC Handlers ---
        async function handleOffer(payload) {
            if (peerConnection) return;
            broadcasterId = payload.senderId;
            log(`🤝 收到来自主播 ${broadcasterId.substring(0,4)} 的 Offer...`);

            peerConnection = new RTCPeerConnection({ iceServers: iceServersConfig });
            peerConnection.onicecandidate = e => {
                if (e.candidate) {
                    ws.send(JSON.stringify({ type: 'candidate', payload: { targetId: broadcasterId, candidate: e.candidate }}));
                }
            };
            peerConnection.ontrack = e => {
                log('▶️ 收到远程媒体流!');
                if (remoteVideo.srcObject !== e.streams[0]) remoteVideo.srcObject = e.streams[0];
            };
            peerConnection.ondatachannel = event => {
                dataChannel = event.channel;
                dataChannel.onmessage = e => {
                    const msg = JSON.parse(e.data);
                    if(msg.type === 'live.chat.message') log(`💬 [${msg.payload.user}] ${msg.payload.text}`);
                    else if(msg.type === 'live.like') log(`👍 [${msg.payload.user}] 送出点赞`);
                    else if(msg.type === 'live.gift.send') log(`🎁 [${msg.payload.user}] 送出礼物: ${msg.payload.gift}`);
                    else if(msg.type === 'live.anchor.mute') log('🔇 主播已静音');
                    else if(msg.type === 'live.anchor.unmute') log('🔊 主播已取消静音');
                };
                dataChannel.onopen = () => log('💬 数据通道已开启。');
                dataChannel.onclose = () => log('💬 数据通道已关闭。');
            };
            peerConnection.onconnectionstatechange = () => {
                log(`🔄 连接状态: ${peerConnection.connectionState}`);
                if (['disconnected', 'failed', 'closed'].includes(peerConnection.connectionState)) {
                    cleanupConnection();
                    showRoomSelection();
                }
            };
            
            await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            
            ws.send(JSON.stringify({ type: 'answer', payload: { targetId: broadcasterId, answer: answer }}));
        }

        async function handleCandidate(payload) {
            if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate));
        }

        function handleViewerMutedStatus(payload) {
            isMuted = payload.isMuted;
            log(`${isMuted ? '🤫 您已被禁言' : '🔊 您已被解除禁言'}`);
            updateChatControlsState();
        }

        function cleanupConnection() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (dataChannel) {
                dataChannel.close();
                dataChannel = null;
            }
            remoteVideo.srcObject = null;
            broadcasterId = null;
            currentRoomId = null;
            isMuted = false; // Reset mute status
            log('🧹 清理连接资源。');
        }

        // --- Initial Load ---
        initializeUser();
    </script>
</body>
</html>
